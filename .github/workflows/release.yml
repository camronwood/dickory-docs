name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  RUST_VERSION: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS (Apple Silicon)
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS (Intel)
          - platform: windows-latest
            args: ""
            name: Windows
          - platform: ubuntu-22.04
            args: ""
            name: Linux (x86_64)
            install_linux_deps: true
          - platform: ubuntu-22.04-arm
            args: ""
            name: Linux (ARM64)
            install_linux_deps: true

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.install_linux_deps == true
        run: |
          # ARM runners often cannot reach ports.ubuntu.com over IPv6.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Dickory Docs ${{ github.ref_name }}
          releaseBody: |
            ## Install Dickory Docs

            Pick the installer for your platform:

            | Platform | File |
            |----------|------|
            | **macOS** (`uname -m` → `arm64`) | `*_aarch64.dmg` (Apple Silicon, native) |
            | **macOS** (`uname -m` → `x86_64`) | `*_x64.dmg` (Intel) |
            | **Windows** | `.msi` installer (or `.exe` setup) |
            | **Linux** · `uname -m` → `x86_64` | `*_amd64.AppImage` and/or `*_amd64.deb` |
            | **Linux** · `uname -m` → `aarch64` | `*_aarch64.AppImage` and/or `*_aarch64.deb` |

            **Linux:** Run `uname -m` — use **amd64** artifacts on Intel/AMD PCs, **aarch64** on ARM (Raspberry Pi, ARM laptops). Ubuntu 24.04: prefer AppImage; install FUSE once with `sudo apt install libfuse2t64` or `libfuse2`.

            On Apple Silicon, if the `aarch64` build misbehaves, use `*_x64.dmg` (runs under Rosetta).

            **macOS:** If macOS blocks the app (unsigned build), right-click the app → **Open**, or allow it in **System Settings → Privacy & Security**.

            **From source:** See the [README](https://github.com/camronwood/dickory-docs#quick-start).
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: --features custom-protocol ${{ matrix.args }}
