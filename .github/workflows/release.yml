name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  RUST_VERSION: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS (Apple Silicon)
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS (Intel)
          - platform: windows-latest
            args: ""
            name: Windows
          - platform: ubuntu-22.04
            args: ""
            name: Linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Dickory Docs ${{ github.ref_name }}
          releaseBody: |
            ## Install Dickory Docs

            Pick the installer for your platform:

            | Platform | File |
            |----------|------|
            | **macOS** (`uname -m` → `arm64`) | `*_aarch64.dmg` (Apple Silicon, native) |
            | **macOS** (`uname -m` → `x86_64`) | `*_x64.dmg` (Intel) |
            | **Windows** | `.msi` installer (or `.exe` setup) |
            | **Linux** | `.AppImage` and/or `.deb` |

            On Apple Silicon, if the `aarch64` build misbehaves, use `*_x64.dmg` (runs under Rosetta).

            **macOS:** If macOS blocks the app (unsigned build), right-click the app → **Open**, or allow it in **System Settings → Privacy & Security**.

            **From source:** See the [README](https://github.com/camronwood/dickory-docs#quick-start).
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: --features custom-protocol ${{ matrix.args }}
