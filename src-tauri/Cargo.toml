[package]
name = "dickory-docs"
version = "0.3.1"
description = "Dickory Docs — local Mermaid diagram viewer for Markdown on disk"
authors = ["Camron Wood"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "cli", "dialog-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
walkdir = "2"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
